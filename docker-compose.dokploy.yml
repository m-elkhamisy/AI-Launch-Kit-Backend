x-launchkit-service: &launchkit-service
  image: ai-launch-kit-backend:${LAUNCHKIT_IMAGE_TAG:-staging}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-launchkit}
      POSTGRES_USER: ${POSTGRES_USER:-launchkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - launchkit_postgres:/var/lib/postgresql/data

  migrate:
    <<: *launchkit-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *launchkit-service
    command:
      - uvicorn
      - launchkit.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *launchkit-service
    command: ["python", "-m", "launchkit.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  launchkit_postgres:
