services:
  api:
    image: ai-launch-kit-backend:${LAUNCHKIT_IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - launchkit_data:/app/local_data
    command:
      - uvicorn
      - launchkit.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  launchkit_data:
