[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-launch-kit-backend"
version = "0.1.0"
description = "Backend capabilities for the AI Launch Kit website generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pillow>=11,<13",
    "pyjwt>=2.10,<3",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=24.4,<27",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launchkit"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["launchkit"]

[tool.coverage.report]
show_missing = true
skip_covered = true
