services:
  api:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - launchkit_data:/app/local_data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  launchkit_data:
